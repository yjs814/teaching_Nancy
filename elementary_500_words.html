var current=1,quizWords=[],q=0,tiles=[],chosen=[];
var select=document.getElementById("pageSelect");
var cards=document.getElementById("cards");
var title=document.getElementById("title");
var quiz=document.getElementById("quiz");
var clue=document.getElementById("clue");
var answer=document.getElementById("answer");
var letters=document.getElementById("letters");
var feedback=document.getElementById("feedback");
var progress=document.getElementById("progress");

function speak(t){
  try{
    if(!window.speechSynthesis || !window.SpeechSynthesisUtterance) return;
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(t);
    u.lang="en-US"; u.rate=0.8;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function shuffle(a){
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1)),tmp=a[i];a[i]=a[j];a[j]=tmp;
  }
  return a;
}
function norm(s){return String(s).toLowerCase().replace(/[^a-z]/g,"");}
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function bindCards(){
  var cs=cards.getElementsByClassName("card");
  for(var i=0;i<cs.length;i++){
    cs[i].onclick=function(){speak(this.getAttribute("data-word"));};
  }
}
function showPage(p){
  p=parseInt(p,10);
  if(isNaN(p)) p=1;
  if(p<1)p=1;if(p>56)p=56;
  current=p; select.value=String(current); title.innerHTML="第 "+current+" 頁";
  var list=pages[String(current)] || pages[current] || [];
  var h="";
  for(var i=0;i<list.length;i++){
    h+='<button class="card" type="button" data-word="'+esc(list[i][0])+'"><span class="sound">🔊</span><span class="en">'+esc(list[i][0])+'</span><span class="zh">'+esc(list[i][1])+'</span></button>';
  }
  cards.innerHTML=h;
  bindCards();
}
select.onchange=function(){showPage(this.value);};
document.getElementById("prev").onclick=function(){showPage(current-1);};
document.getElementById("nextPage").onclick=function(){showPage(current+1);};

function setup(){
  var w=quizWords[q],word=norm(w[0]),arr=[],i;
  chosen=[]; tiles=[];
  for(i=0;i<word.length;i++) arr.push({char:word.charAt(i),id:i,used:false});
  tiles=shuffle(arr);
  clue.innerHTML=esc(w[1]);
  progress.innerHTML="第 "+(q+1)+" 題 / 共 "+quizWords.length+" 題";
  feedback.innerHTML="";
  draw(); speak(w[0]);
}
function draw(){
  var i,b;
  answer.innerHTML="";
  if(chosen.length===0) answer.className="answer empty"; else answer.className="answer";
  for(i=0;i<chosen.length;i++){
    b=document.createElement("button");b.className="chosen";b.innerHTML=chosen[i].char;
    (function(t){b.onclick=function(){removeTile(t);};})(chosen[i]);
    answer.appendChild(b);
  }
  letters.innerHTML="";
  for(i=0;i<tiles.length;i++){
    b=document.createElement("button");b.className="letter";b.innerHTML=tiles[i].char;b.disabled=tiles[i].used;
    (function(t){b.onclick=function(){t.used=true;chosen.push(t);feedback.innerHTML="";draw();};})(tiles[i]);
    letters.appendChild(b);
  }
}
function removeTile(t){
  t.used=false;
  var n=[];for(var i=0;i<chosen.length;i++)if(chosen[i]!==t)n.push(chosen[i]);
  chosen=n;feedback.innerHTML="";draw();
}
function nextQuestion(){q=(q+1)%quizWords.length;setup();}
document.getElementById("quizBtn").onclick=function(){
  var src=pages[String(current)] || pages[current] || [];
  quizWords=shuffle(src.slice(0));q=0;quiz.className="quiz open";setup();
  try{quiz.scrollIntoView({behavior:"smooth"});}catch(e){quiz.scrollIntoView();}
};
document.getElementById("hear").onclick=function(){speak(quizWords[q][0]);};
document.getElementById("undo").onclick=function(){if(chosen.length)removeTile(chosen[chosen.length-1]);};
document.getElementById("remix").onclick=function(){
  for(var i=0;i<chosen.length;i++)chosen[i].used=false;
  chosen=[];shuffle(tiles);feedback.innerHTML="";draw();
};
document.getElementById("check").onclick=function(){
  var right=norm(quizWords[q][0]),got="",i;
  for(i=0;i<chosen.length;i++)got+=chosen[i].char;
  if(got===right){feedback.innerHTML="🎉 答對了！"+esc(quizWords[q][0]);feedback.style.color="#37815c";speak(quizWords[q][0]);}
  else{feedback.innerHTML=got.length<right.length?"還有字母沒選完喔！":"再試一次，你快答對了！";feedback.style.color="#c45d75";}
};
document.getElementById("nextQ").onclick=nextQuestion;
document.getElementById("close").onclick=function(){quiz.className="quiz";try{window.speechSynthesis.cancel();}catch(e){}};
bindCards();
</script></body></html>
