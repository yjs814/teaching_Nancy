<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>國小必學500英語單字｜Nancy 老師</title><style>
:root{--ink:#614b43;--purple:#745bc4;--pink:#ffe0e9;--yellow:#fff0b8}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:"Microsoft JhengHei",system-ui,sans-serif;background:radial-gradient(circle at 5% 9%,#ffdbe5 0 72px,transparent 74px),radial-gradient(circle at 95% 12%,#e4dcfa 0 90px,transparent 92px),#fffaf2}.app{width:min(1000px,calc(100% - 26px));margin:auto;padding:13px 0 30px}.top{display:grid;grid-template-columns:1fr 130px;align-items:center;gap:20px;padding:17px 24px;border:3px solid #fff;border-radius:27px;background:linear-gradient(135deg,#fff,#fff0ec);box-shadow:0 11px 28px #6d554c1c}.tag{display:inline-block;padding:3px 11px;border-radius:999px;background:#e8defd;font-size:11px;font-weight:900}.top h1{margin:5px 0 2px;font-size:clamp(27px,4vw,41px)}.top p{margin:3px 0;color:#947970}.cover{width:110px;height:138px;object-fit:cover;border:4px solid #fff;border-radius:14px;box-shadow:0 8px 18px #765b5230}.pages{display:flex;gap:8px;margin:13px 0}.page{padding:10px 18px;border:2px solid var(--purple);border-radius:13px;background:var(--purple);color:#fff;font-weight:900}.launch{width:100%;margin-bottom:11px;padding:11px;border:0;border-radius:14px;background:var(--purple);color:#fff;font:inherit;font-weight:900;cursor:pointer}.panel,.quiz{padding:19px;border:3px solid #fff;border-radius:27px;background:#ffffffdf;box-shadow:0 11px 28px #6d554c1c}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.head h2{margin:0}.badge{padding:6px 11px;border-radius:999px;background:var(--yellow);font-weight:900}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{position:relative;min-height:102px;padding:15px 38px 13px 15px;border:2px solid #f0dce2;border-radius:18px;background:#fff4f6;text-align:left;color:var(--ink);cursor:pointer}.card:nth-child(3n+2){background:#f5f1ff;border-color:#e1d8f3}.card:nth-child(3n){background:#f0faf5;border-color:#d6ecdf}.en{display:block;font-size:21px;font-weight:950}.zh{display:block;margin-top:7px;color:#92766d}.sound{position:absolute;right:11px;top:11px}.quiz{display:none;margin-top:12px;text-align:center}.quiz.open{display:block}.clue{margin:18px 0 5px;font-size:clamp(30px,5vw,45px);font-weight:950}.answer{min-height:65px;margin:14px 0;padding:10px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:7px;border:3px dashed #d7c8ed;border-radius:18px;background:#faf7ff}.answer.empty:after{content:'點選下方字母開始拼字';color:#ab9db5;font-weight:700}.letters{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:14px 0}.letter,.chosen{width:48px;height:52px;border:2px solid var(--purple);border-radius:13px;background:#fff;color:#61449f;font-size:24px;font-weight:950;cursor:pointer;box-shadow:0 4px 0 #d6caeb}.letter:disabled{opacity:.18}.chosen{background:#f3edff}.feedback{min-height:30px;margin:8px;font-size:18px;font-weight:900}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.action{padding:10px 16px;border:0;border-radius:13px;background:#eee8f7;color:#604b76;font:inherit;font-weight:900;cursor:pointer}.primary{background:var(--purple);color:#fff}.listen{background:#dff2ff;color:#33789b}.home{display:inline-block;margin-top:13px;color:#7359ac;font-weight:900;text-decoration:none}@media(max-width:620px){.top{grid-template-columns:1fr 85px;padding:15px}.cover{width:78px;height:100px}.cards{grid-template-columns:repeat(2,1fr)}.panel,.quiz{padding:14px}}@media(max-width:380px){.cards{grid-template-columns:1fr}}</style></head><body><main class="app">
<header class="top"><div><span class="tag">NANCY'S VOCABULARY GARDEN</span><h1>國小必學500英語單字</h1><p>目前收錄第 1 頁，以後可以逐頁增加 ♡</p></div><img class="cover" src="elementary_500_cover.jpg" alt="國小必學500英語單字練習簿封面"></header><div class="pages"><span class="page">第 1 頁</span></div><button class="launch" id="startQuiz">🧩 開始第 1 頁重組單字練習</button><section class="panel"><div class="head"><h2>第 1 頁單字</h2><span class="badge">9 個單字</span></div><div class="cards" id="cards"></div></section><section class="quiz" id="quiz"><div class="head"><h2>🧩 重組單字練習</h2><span class="badge" id="progress"></span></div><div class="clue" id="clue"></div><button class="action listen" id="hear">🔊 聽發音</button><div class="answer empty" id="answer"></div><div class="letters" id="letters"></div><div class="feedback" id="feedback"></div><div class="actions"><button class="action" id="undo">↩ 撤回</button><button class="action" id="mix">🔀 重新排列</button><button class="action primary" id="check">✓ 檢查答案</button><button class="action" id="next">跳過／下一題 →</button><button class="action" id="close">關閉練習</button></div></section><a class="home" href="index.html">🏠 回到單字練習首頁</a></main><script>
const words=[['a','一個（冠詞）'],['an','一個（冠詞）'],['the','這；那（定冠詞）'],['I am','我是'],['you are','你／你們是'],['he is','他是'],['she is','她是'],['it is','它／牠是'],['we are','我們是']];let quizWords=[],q=0,tiles=[],chosen=[];const cards=document.querySelector('#cards'),quiz=document.querySelector('#quiz'),clue=document.querySelector('#clue'),answer=document.querySelector('#answer'),letters=document.querySelector('#letters'),feedback=document.querySelector('#feedback'),progress=document.querySelector('#progress');function speak(w){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.78;u.pitch=1.15;speechSynthesis.speak(u)}function shuffle(a){for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}const norm=s=>s.toLowerCase().replace(/[^a-z]/g,'');words.forEach(w=>{const b=document.createElement('button');b.className='card';b.innerHTML=`<span class="sound">🔊</span><span class="en">${w[0]}</span><span class="zh">${w[1]}</span>`;b.onclick=()=>speak(w[0]);cards.appendChild(b)});function setup(){const w=quizWords[q];chosen=[];tiles=shuffle([...norm(w[0])].map((char,id)=>({char,id,used:false})));clue.textContent=w[1];progress.textContent=`第 ${q+1} 題／共 ${quizWords.length} 題`;feedback.textContent='';draw();speak(w[0])}function draw(){answer.innerHTML='';answer.classList.toggle('empty',!chosen.length);chosen.forEach(t=>{const b=document.createElement('button');b.className='chosen';b.textContent=t.char;b.onclick=()=>remove(t);answer.appendChild(b)});letters.innerHTML='';tiles.forEach(t=>{const b=document.createElement('button');b.className='letter';b.textContent=t.char;b.disabled=t.used;b.onclick=()=>{t.used=true;chosen.push(t);feedback.textContent='';draw()};letters.appendChild(b)})}function remove(t){t.used=false;chosen=chosen.filter(x=>x!==t);feedback.textContent='';draw()}function next(){q=(q+1)%quizWords.length;setup()}document.querySelector('#startQuiz').onclick=()=>{quizWords=shuffle([...words]);q=0;quiz.classList.add('open');setup();quiz.scrollIntoView({behavior:'smooth'})};document.querySelector('#hear').onclick=()=>speak(quizWords[q][0]);document.querySelector('#undo').onclick=()=>chosen.length&&remove(chosen[chosen.length-1]);document.querySelector('#mix').onclick=()=>{chosen.forEach(t=>t.used=false);chosen=[];shuffle(tiles);feedback.textContent='';draw()};document.querySelector('#check').onclick=()=>{const right=norm(quizWords[q][0]),got=chosen.map(t=>t.char).join('');if(got===right){feedback.textContent=`🎉 答對了！${quizWords[q][0]}`;feedback.style.color='#39835c';speak(quizWords[q][0])}else{feedback.textContent=got.length<right.length?'還有字母沒選完喔！':'再試一次，你快答對了！';feedback.style.color='#c45d75'}};document.querySelector('#next').onclick=next;document.querySelector('#close').onclick=()=>{quiz.classList.remove('open');speechSynthesis.cancel()};</script></body></html>
