<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grammar Space Beginner 1｜單字學習</title>
  <style>
    :root {
      --cream: #fff8ec;
      --card: #ffffff;
      --ink: #2f2f38;
      --muted: #777488;
      --blue: #75b7ff;
      --blue-dark: #3d8fe6;
      --pink: #ff91b5;
      --green: #73d69a;
      --yellow: #ffd76f;
      --red: #ff7777;
      --shadow: 0 18px 40px rgba(68, 65, 92, 0.16);
      --radius: 28px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Arial Rounded MT Bold", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 16%, rgba(255, 215, 111, .38), transparent 24%),
        radial-gradient(circle at 88% 10%, rgba(117, 183, 255, .33), transparent 25%),
        radial-gradient(circle at 85% 80%, rgba(255, 145, 181, .24), transparent 28%),
        var(--cream);
    }

    .app {
      width: min(1100px, calc(100% - 28px));
      margin: 0 auto;
      padding: 24px 0 42px;
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 18px;
    }

    .brand { display: flex; align-items: center; gap: 14px; }
    .logo {
      width: 58px; height: 58px; border-radius: 20px;
      display: grid; place-items: center;
      background: linear-gradient(135deg, #fff, #d9efff);
      box-shadow: var(--shadow);
      font-size: 30px;
    }
    h1 { margin: 0; font-size: clamp(22px, 4vw, 40px); line-height: 1.08; }
    .subtitle { color: var(--muted); margin-top: 6px; font-size: 15px; }

    .top-tools {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end;
    }

    select, button {
      font-family: inherit;
      border: 0;
      outline: 0;
    }

    .select {
      appearance: none;
      background: var(--card);
      color: var(--ink);
      border: 3px solid rgba(61, 143, 230, .18);
      border-radius: 999px;
      padding: 12px 42px 12px 18px;
      min-width: 142px;
      font-size: 16px;
      box-shadow: 0 10px 24px rgba(60, 106, 180, .10);
      background-image: linear-gradient(45deg, transparent 50%, var(--blue-dark) 50%), linear-gradient(135deg, var(--blue-dark) 50%, transparent 50%);
      background-position: calc(100% - 22px) 50%, calc(100% - 15px) 50%;
      background-size: 7px 7px, 7px 7px;
      background-repeat: no-repeat;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 18px 0;
    }

    .tab {
      cursor: pointer;
      padding: 18px 16px;
      border-radius: 24px;
      font-size: clamp(18px, 3vw, 26px);
      font-weight: 900;
      color: #fff;
      background: linear-gradient(135deg, var(--blue), var(--blue-dark));
      box-shadow: 0 13px 24px rgba(47, 126, 222, .22);
      transform: translateY(0);
      transition: .18s ease;
    }
    .tab:nth-child(2) { background: linear-gradient(135deg, var(--pink), #ff6e98); box-shadow: 0 13px 24px rgba(255, 110, 152, .2); }
    .tab:hover { transform: translateY(-2px); }
    .tab.active { outline: 5px solid rgba(255,255,255,.8); box-shadow: 0 16px 30px rgba(58, 83, 128, .28); }

    .panel {
      background: rgba(255,255,255,.84);
      border: 4px solid rgba(255,255,255,.86);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: clamp(16px, 3vw, 28px);
      min-height: 520px;
      position: relative;
      overflow: hidden;
    }

    .panel::before {
      content: "";
      position: absolute; inset: -80px auto auto -70px;
      width: 170px; height: 170px; border-radius: 50%;
      background: rgba(255, 215, 111, .22);
      pointer-events: none;
    }

    .screen { display: none; position: relative; z-index: 1; }
    .screen.active { display: block; }

    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: center; }
    .row.space { justify-content: space-between; }

    .pill {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 42px;
      padding: 8px 15px;
      background: #f3f7ff;
      border-radius: 999px;
      color: #4c5b7a;
      font-weight: 800;
      font-size: 14px;
    }

    .study-card {
      margin: 22px auto 20px;
      max-width: 760px;
      min-height: 315px;
      border-radius: 34px;
      background: linear-gradient(180deg, #ffffff, #fff9ef);
      border: 4px solid #fff;
      box-shadow: 0 20px 42px rgba(81, 76, 96, .16);
      display: grid;
      place-items: center;
      padding: 34px 22px;
      cursor: pointer;
      user-select: none;
      transition: .22s ease;
    }
    .study-card:hover { transform: translateY(-3px); }
    .word-main {
      font-size: clamp(42px, 9vw, 84px);
      line-height: 1.05;
      font-weight: 950;
      color: #2f6eb8;
      text-align: center;
      overflow-wrap: anywhere;
    }
    .word-zh {
      margin-top: 22px;
      font-size: clamp(26px, 5vw, 46px);
      font-weight: 900;
      color: #494353;
      text-align: center;
    }
    .small-note { margin-top: 12px; color: var(--muted); font-size: 14px; text-align: center; }

    .btn {
      cursor: pointer;
      min-height: 48px;
      padding: 11px 18px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 900;
      color: #fff;
      background: linear-gradient(135deg, var(--blue), var(--blue-dark));
      box-shadow: 0 10px 18px rgba(61, 143, 230, .22);
      transition: .16s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(1px) scale(.99); }
    .btn.secondary { background: linear-gradient(135deg, #bab7c9, #88839f); box-shadow: 0 10px 18px rgba(80, 76, 100, .14); }
    .btn.green { background: linear-gradient(135deg, #8ee0aa, #48bd75); box-shadow: 0 10px 18px rgba(72, 189, 117, .18); }
    .btn.yellow { background: linear-gradient(135deg, #ffe08a, #f1a91b); color: #5f4610; box-shadow: 0 10px 18px rgba(241, 169, 27, .16); }
    .btn.pink { background: linear-gradient(135deg, #ff9abb, #ff6694); box-shadow: 0 10px 18px rgba(255, 102, 148, .2); }
    .btn.ghost { background: #fff; color: #4571a8; border: 3px solid #dbeaff; box-shadow: none; }

    .practice-head { text-align: center; margin: 8px auto 20px; }
    .question-label { color: var(--muted); font-size: 15px; font-weight: 800; margin-bottom: 8px; }
    .meaning {
      font-size: clamp(34px, 7vw, 62px);
      font-weight: 950;
      line-height: 1.08;
      color: #ef6d98;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .answer-area {
      margin: 24px auto 18px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      max-width: 900px;
      min-height: 76px;
    }
    .box {
      width: clamp(34px, 7vw, 54px);
      height: clamp(44px, 8vw, 64px);
      border-radius: 16px;
      border: 3px dashed #acd1ff;
      background: #f8fbff;
      display: grid;
      place-items: center;
      font-size: clamp(22px, 5vw, 34px);
      font-weight: 950;
      color: #2f6eb8;
      cursor: pointer;
      user-select: none;
    }
    .box.fixed {
      border: 0;
      background: transparent;
      color: #908ba3;
      cursor: default;
      width: clamp(20px, 4vw, 34px);
      font-size: clamp(18px, 4vw, 30px);
    }
    .box.space { width: clamp(18px, 5vw, 42px); }

    .tiles {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 18px auto 16px;
      max-width: 880px;
      min-height: 70px;
    }
    .tile {
      min-width: clamp(42px, 8vw, 60px);
      height: clamp(46px, 8vw, 62px);
      padding: 0 14px;
      border-radius: 18px;
      background: #fff;
      border: 3px solid #ffe4a7;
      box-shadow: 0 9px 16px rgba(191, 138, 38, .13);
      display: grid;
      place-items: center;
      font-size: clamp(22px, 5vw, 34px);
      font-weight: 950;
      color: #5f4610;
      cursor: pointer;
      user-select: none;
      transition: .12s ease;
    }
    .tile:hover { transform: translateY(-2px); background: #fff8df; }
    .tile.used { visibility: hidden; }

    .feedback {
      min-height: 42px;
      text-align: center;
      font-size: clamp(18px, 3vw, 26px);
      font-weight: 950;
      color: var(--muted);
      margin: 8px 0 12px;
    }
    .feedback.good { color: #22a05b; }
    .feedback.bad { color: #ec5555; }
    .shake { animation: shake .28s linear; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-7px); }
      75% { transform: translateX(7px); }
    }

    .word-list {
      margin-top: 22px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 10px;
    }
    .mini-card {
      background: #fff;
      border-radius: 18px;
      padding: 12px 14px;
      border: 2px solid #f0edf6;
      box-shadow: 0 6px 12px rgba(62, 58, 88, .06);
    }
    .mini-en { font-weight: 950; color: #3d72b5; font-size: 18px; overflow-wrap:anywhere; }
    .mini-zh { color: #696477; margin-top: 4px; font-size: 14px; }

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 999;
    }
    .star {
      position: absolute;
      top: -24px;
      font-size: 22px;
      animation: fall 900ms ease-in forwards;
    }
    @keyframes fall {
      to { transform: translateY(105vh) rotate(340deg); opacity: 0; }
    }

    footer {
      color: var(--muted);
      text-align: center;
      font-size: 13px;
      margin-top: 16px;
    }

    @media (max-width: 720px) {
      header { align-items: flex-start; flex-direction: column; }
      .top-tools { width: 100%; justify-content: stretch; }
      .select { width: 100%; }
      .tabs { gap: 9px; }
      .tab { padding: 14px 10px; border-radius: 20px; }
      .panel { min-height: auto; }
      .study-card { min-height: 260px; }
      .row.space { justify-content: center; }
      .btn { flex: 1 1 135px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="logo">📚</div>
        <div>
          <h1>Grammar Space Beginner 1</h1>
          <div class="subtitle">單字學習｜重組練習</div>
        </div>
      </div>
      <div class="top-tools">
        <select id="unitSelect" class="select" aria-label="選擇單元"></select>
      </div>
    </header>

    <div class="tabs" role="tablist">
      <button class="tab active" id="studyTab" type="button">📖 學習</button>
      <button class="tab" id="practiceTab" type="button">🧩 重組練習</button>
    </div>

    <main class="panel">
      <section id="studyScreen" class="screen active">
        <div class="row space">
          <div class="pill" id="studyUnitInfo">Unit 1</div>
          <div class="pill" id="studyProgress">1 / 10</div>
        </div>

        <div class="study-card" id="studyCard" title="點一下可播放發音">
          <div>
            <div class="word-main" id="studyWord">elephant</div>
            <div class="word-zh" id="studyZh">大象</div>
            <div class="small-note">點單字卡或按「發音」可以聽英文</div>
          </div>
        </div>

        <div class="row">
          <button class="btn secondary" id="prevBtn" type="button">← 上一個</button>
          <button class="btn green" id="speakBtn" type="button">🔊 發音</button>
          <button class="btn yellow" id="shuffleStudyBtn" type="button">🎲 打亂</button>
          <button class="btn" id="nextBtn" type="button">下一個 →</button>
        </div>

        <div class="word-list" id="wordList"></div>
      </section>

      <section id="practiceScreen" class="screen">
        <div class="row space">
          <div class="pill" id="practiceUnitInfo">Unit 1</div>
          <div class="pill" id="practiceProgress">1 / 10</div>
        </div>

        <div class="practice-head">
          <div class="question-label">請把字母排成正確英文單字</div>
          <div class="meaning" id="practiceMeaning">大象</div>
        </div>

        <div class="answer-area" id="answerArea" aria-label="作答區"></div>
        <div class="tiles" id="tiles" aria-label="字母區"></div>
        <div class="feedback" id="feedback"></div>

        <div class="row">
          <button class="btn secondary" id="clearBtn" type="button">清除</button>
          <button class="btn yellow" id="hintBtn" type="button">提示</button>
          <button class="btn ghost" id="showAnswerBtn" type="button">看答案</button>
          <button class="btn pink" id="newPracticeBtn" type="button">重排</button>
          <button class="btn" id="practiceNextBtn" type="button">下一題 →</button>
        </div>
      </section>
    </main>

    <footer>Made for Nancy Teacher｜單一 HTML 檔，可直接上傳 GitHub Pages</footer>
  </div>

  <div class="stars" id="stars"></div>

    const VOCAB = {"1": [{"en": "elephant", "zh": "大象"}, {"en": "teacher", "zh": "老師"}, {"en": "student", "zh": "學生"}, {"en": "library", "zh": "圖書館"}, {"en": "hamster", "zh": "倉鼠"}, {"en": "giraffe", "zh": "長頸鹿"}, {"en": "balloon", "zh": "氣球"}, {"en": "wallet", "zh": "皮夾"}, {"en": "school", "zh": "學校"}, {"en": "rabbit", "zh": "兔子"}], "2": [{"en": "scientist", "zh": "科學家"}, {"en": "bookshelf", "zh": "書架"}, {"en": "umbrella", "zh": "雨傘"}, {"en": "octopus", "zh": "章魚"}, {"en": "office", "zh": "辦公室"}, {"en": "island", "zh": "島嶼"}, {"en": "eraser", "zh": "橡皮擦"}, {"en": "candle", "zh": "蠟燭"}, {"en": "artist", "zh": "藝術家"}, {"en": "truck", "zh": "卡車"}], "3": [{"en": "butterfly", "zh": "蝴蝶"}, {"en": "sandwich", "zh": "三明治"}, {"en": "ladybug", "zh": "瓢蟲"}, {"en": "balloon", "zh": "氣球"}, {"en": "potato", "zh": "馬鈴薯"}, {"en": "cherry", "zh": "櫻桃"}, {"en": "watch", "zh": "手錶"}, {"en": "story", "zh": "故事"}, {"en": "scarf", "zh": "圍巾"}, {"en": "knife", "zh": "刀子"}], "4": [{"en": "toothpaste", "zh": "牙膏"}, {"en": "shampoo", "zh": "洗髮精"}, {"en": "yogurt", "zh": "優格"}, {"en": "orange", "zh": "橘子"}, {"en": "dollar", "zh": "元"}, {"en": "cookie", "zh": "餅乾"}, {"en": "cheese", "zh": "起司"}, {"en": "butter", "zh": "奶油"}, {"en": "banana", "zh": "香蕉"}, {"en": "water", "zh": "水"}], "5": [{"en": "delicious", "zh": "美味的"}, {"en": "classmate", "zh": "同班同學"}, {"en": "musician", "zh": "音樂家"}, {"en": "magical", "zh": "有魔力的"}, {"en": "foolish", "zh": "愚蠢的"}, {"en": "sleepy", "zh": "想睡的"}, {"en": "heavy", "zh": "重的"}, {"en": "brave", "zh": "勇敢的"}, {"en": "they", "zh": "他們/牠們"}, {"en": "tall", "zh": "高的"}], "6": [{"en": "hairdresser", "zh": "美髮師"}, {"en": "dragonfly", "zh": "蜻蜓"}, {"en": "princess", "zh": "公主"}, {"en": "diligent", "zh": "勤勉的"}, {"en": "daughter", "zh": "女兒"}, {"en": "Canadian", "zh": "加拿大的"}, {"en": "American", "zh": "美國的"}, {"en": "swimmer", "zh": "游泳選手"}, {"en": "mailman", "zh": "郵差"}, {"en": "chicken", "zh": "小雞/雞肉"}], "7": [{"en": "blueberries", "zh": "藍莓"}, {"en": "post office",  "zh": "繪畫"}, {"en": "drink", "zh": "喝"}, {"en": "dance", "zh": "跳舞"}, {"en": "climb", "zh": "攀爬"}, {"en": "work", "zh": "工作"}, {"en": "wear", "zh": "穿著"}], "14": [{"en": "have/has", "zh": "有"}, {"en": "get up", "zh": "起床"}, {"en": "watch", "zh": "觀看"}, {"en": "teach", "zh": "教導"}, {"en": "study", "zh": "學習/研讀"}, {"en": "catch", "zh": "抓/接"}, {"en": "brush", "zh": "刷"}, {"en": "wash", "zh": "洗"}, {"en": "ride", "zh": "騎"}, {"en": "love", "zh": "愛"}], "15": [{"en": "horror movie", "zh": "恐怖片"}, {"en": "exercise", "zh": "運動"}, {"en": "garlic", "zh": "大蒜"}, {"en": "common", "zh": "共同點"}, {"en": "store", "zh": "商店"}, {"en": "flute", "zh": "長笛"}, {"en": "enjoy", "zh": "享受"}, {"en": "sell", "zh": "賣"}, {"en": "ski", "zh": "滑雪"}], "16": [{"en": "questionnaire", "zh": "問卷"}, {"en": "take a walk", "zh": "散步"}, {"en": "uniform", "zh": "制服"}, {"en": "evening", "zh": "傍晚/晚上"}, {"en": "carrots", "zh": "紅蘿蔔"}, {"en": "habit", "zh": "習慣"}, {"en": "early", "zh": "早的/早地"}, {"en": "boots", "zh": "靴子"}, {"en": "bark", "zh": "吠叫"}], "17": [{"en": "chocolate cake", "zh": "巧克力蛋糕"}, {"en": "jigsaw puzzle", "zh": "拼圖"}, {"en": "text message", "zh": "簡訊"}, {"en": "spaghetti", "zh": "義大利麵"}, {"en": "badminton", "zh": "羽毛球"}, {"en": "practice", "zh": "練習"}, {"en": "hairpin", "zh": "髮夾"}, {"en": "collect", "zh": "收集"}, {"en": "chicken", "zh": "雞肉"}, {"en": "garlic", "zh": "大蒜"}], "18": [{"en": "dribble", "zh": "運球"}, {"en": "violin", "zh": "小提琴"}, {"en": "guitar", "zh": "吉他"}, {"en": "skate", "zh": "溜冰"}, {"en": "shoot", "zh": "投籃/射門"}, {"en": "piano", "zh": "鋼琴"}, {"en": "chess", "zh": "西洋棋"}, {"en": "team", "zh": "團隊"}, {"en": "talk", "zh": "說話"}, {"en": "pass", "zh": "傳球"}], "19": [{"en": "smartphone", "zh": "智慧型手機"}, {"en": "elevator", "zh": "電梯"}, {"en": "library", "zh": "圖書館"}, {"en": "come in", "zh": "進來"}, {"en": "borrow", "zh": "借"}, {"en": "touch", "zh": "碰觸"}, {"en": "rules", "zh": "規則"}, {"en": "leave", "zh": "離開"}, {"en": "break", "zh": "休息"}, {"en": "open", "zh": "打開"}], "20": [{"en": "climb mountain", "zh": "爬山"}, {"en": "raise hand", "zh": "舉手"}, {"en": "campsite", "zh": "露營地"}, {"en": "respect", "zh": "尊重"}, {"en": "protect", "zh": "保護"}, {"en": "popcorn", "zh": "爆米花"}, {"en": "follow", "zh": "遵守/跟隨"}, {"en": "close", "zh": "關閉"}, {"en": "clean", "zh": "打掃"}, {"en": "wait", "zh": "等待"}]};
    const TOTAL_WORDS = 198;

    const els = {
      unitSelect: document.getElementById('unitSelect'),
      studyTab: document.getElementById('studyTab'),
      practiceTab: document.getElementById('practiceTab'),
      studyScreen: document.getElementById('studyScreen'),
      practiceScreen: document.getElementById('practiceScreen'),
      studyUnitInfo: document.getElementById('studyUnitInfo'),
      studyProgress: document.getElementById('studyProgress'),
      studyCard: document.getElementById('studyCard'),
      studyWord: document.getElementById('studyWord'),
      studyZh: document.getElementById('studyZh'),
      prevBtn: document.getElementById('prevBtn'),
      nextBtn: document.getElementById('nextBtn'),
      speakBtn: document.getElementById('speakBtn'),
      shuffleStudyBtn: document.getElementById('shuffleStudyBtn'),
      wordList: document.getElementById('wordList'),
      practiceUnitInfo: document.getElementById('practiceUnitInfo'),
      practiceProgress: document.getElementById('practiceProgress'),
      practiceMeaning: document.getElementById('practiceMeaning'),
      answerArea: document.getElementById('answerArea'),
      tiles: document.getElementById('tiles'),
      feedback: document.getElementById('feedback'),
      clearBtn: document.getElementById('clearBtn'),
      hintBtn: document.getElementById('hintBtn'),
      showAnswerBtn: document.getElementById('showAnswerBtn'),
      newPracticeBtn: document.getElementById('newPracticeBtn'),
      practiceNextBtn: document.getElementById('practiceNextBtn'),
      stars: document.getElementById('stars'),
    };

    const state = {
      mode: 'study',
      unit: '1',
      studyIndex: 0,
      studyOrder: [],
      practiceIndex: 0,
      practiceOrder: [],
      answerSlots: [],
      tiles: [],
      autoNextTimer: null,
    };

    function allWords() {
      return Object.entries(VOCAB).flatMap(([unit, words]) => words.map(w => ({...w, unit})));
    }

    function currentWords() {
      if (state.unit === 'all') return allWords();
      return VOCAB[state.unit].map(w => ({...w, unit: state.unit}));
    }

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function setupUnits() {
      els.unitSelect.innerHTML = '';
      for (let i = 1; i <= 20; i++) {
        const opt = document.createElement('option');
        opt.value = String(i);
        opt.textContent = `Unit ${i}`;
        els.unitSelect.appendChild(opt);
      }
      const all = document.createElement('option');
      all.value = 'all';
      all.textContent = `全部單元（${TOTAL_WORDS}）`;
      els.unitSelect.appendChild(all);
    }

    function setMode(mode) {
      state.mode = mode;
      els.studyTab.classList.toggle('active', mode === 'study');
      els.practiceTab.classList.toggle('active', mode === 'practice');
      els.studyScreen.classList.toggle('active', mode === 'study');
      els.practiceScreen.classList.toggle('active', mode === 'practice');
      if (mode === 'study') renderStudy();
      if (mode === 'practice') renderPractice();
    }

    function resetForUnit() {
      state.studyIndex = 0;
      state.practiceIndex = 0;
      state.studyOrder = currentWords();
      state.practiceOrder = shuffle(currentWords());
      clearTimeout(state.autoNextTimer);
      if (state.mode === 'study') renderStudy();
      else renderPractice();
    }

    function unitLabel(word) {
      return state.unit === 'all' ? `Unit ${word.unit}` : `Unit ${state.unit}`;
    }

    function currentStudyWord() {
      if (!state.studyOrder.length) state.studyOrder = currentWords();
      return state.studyOrder[state.studyIndex];
    }

    function renderStudy() {
      const list = state.studyOrder.length ? state.studyOrder : currentWords();
      state.studyOrder = list;
      if (state.studyIndex >= list.length) state.studyIndex = 0;
      const word = currentStudyWord();
      els.studyUnitInfo.textContent = unitLabel(word);
      els.studyProgress.textContent = `${state.studyIndex + 1} / ${list.length}`;
      els.studyWord.textContent = word.en;
      els.studyZh.textContent = word.zh;
      els.wordList.innerHTML = list.map((w, idx) => `
        <button class="mini-card" type="button" data-idx="${idx}" aria-label="${escapeHtml(w.en)}">
          <div class="mini-en">${escapeHtml(w.en)}</div>
          <div class="mini-zh">${escapeHtml(w.zh)}</div>
        </button>
      `).join('');
      els.wordList.querySelectorAll('.mini-card').forEach(btn => {
        btn.addEventListener('click', () => {
          state.studyIndex = Number(btn.dataset.idx);
          renderStudy();
          speak(currentStudyWord().en);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      });
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'en-US';
      utter.rate = 0.78;
      utter.pitch = 1.05;
      window.speechSynthesis.speak(utter);
    }

    function nextStudy(step) {
      const len = state.studyOrder.length;
      state.studyIndex = (state.studyIndex + step + len) % len;
      renderStudy();
    }

    function currentPracticeWord() {
      if (!state.practiceOrder.length) state.practiceOrder = shuffle(currentWords());
      if (state.practiceIndex >= state.practiceOrder.length) {
        state.practiceIndex = 0;
        state.practiceOrder = shuffle(currentWords());
      }
      return state.practiceOrder[state.practiceIndex];
    }

    function isFixedChar(ch) {
      return ch === ' ' || ch === '/' || ch === '-' || ch === '.';
    }

    function preparePracticeWord() {
      const word = currentPracticeWord();
      const chars = Array.from(word.en);
      const letters = chars
        .map((ch, index) => ({ ch, index }))
        .filter(item => !isFixedChar(item.ch));
      let shuffled = shuffle(letters);
      if (letters.length > 2) {
        let same = shuffled.every((item, i) => item.ch === letters[i].ch);
        let tries = 0;
        while (same && tries < 10) {
          shuffled = shuffle(letters);
          same = shuffled.every((item, i) => item.ch === letters[i].ch);
          tries++;
        }
      }
      state.answerSlots = chars.map((ch, index) => isFixedChar(ch)
        ? { fixed: true, ch, correct: ch, tileId: null }
        : { fixed: false, ch: '', correct: ch, tileId: null }
      );
      state.tiles = shuffled.map((item, i) => ({ id: `t${Date.now()}_${i}_${item.index}`, ch: item.ch, used: false }));
      els.feedback.textContent = '';
      els.feedback.className = 'feedback';
    }

    function renderPractice() {
      clearTimeout(state.autoNextTimer);
      preparePracticeWord();
      const word = currentPracticeWord();
      const total = state.practiceOrder.length || currentWords().length;
      els.practiceUnitInfo.textContent = unitLabel(word);
      els.practiceProgress.textContent = `${state.practiceIndex + 1} / ${total}`;
      els.practiceMeaning.textContent = word.zh;
      renderAnswerAndTiles();
    }

    function renderAnswerAndTiles() {
      els.answerArea.innerHTML = '';
      state.answerSlots.forEach((slot, idx) => {
        const box = document.createElement('button');
        box.type = 'button';
        if (slot.fixed) {
          box.className = 'box fixed' + (slot.ch === ' ' ? ' space' : '');
          box.textContent = slot.ch === ' ' ? '' : slot.ch;
          box.disabled = true;
        } else {
          box.className = 'box';
          box.textContent = slot.ch;
          box.dataset.index = String(idx);
          box.addEventListener('click', () => removeFromSlot(idx));
        }
        els.answerArea.appendChild(box);
      });

      els.tiles.innerHTML = '';
      state.tiles.forEach(tile => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'tile' + (tile.used ? ' used' : '');
        btn.textContent = tile.ch;
        btn.dataset.id = tile.id;
        btn.addEventListener('click', () => useTile(tile.id));
        els.tiles.appendChild(btn);
      });
    }

    function firstEmptySlotIndex() {
      return state.answerSlots.findIndex(slot => !slot.fixed && !slot.ch);
    }

    function useTile(tileId) {
      const tile = state.tiles.find(t => t.id === tileId);
      if (!tile || tile.used) return;
      const idx = firstEmptySlotIndex();
      if (idx === -1) return;
      state.answerSlots[idx].ch = tile.ch;
      state.answerSlots[idx].tileId = tile.id;
      tile.used = true;
      renderAnswerAndTiles();
      maybeCheckAnswer();
    }

    function removeFromSlot(idx) {
      const slot = state.answerSlots[idx];
      if (!slot || slot.fixed || !slot.ch) return;
      const tile = state.tiles.find(t => t.id === slot.tileId);
      if (tile) tile.used = false;
      slot.ch = '';
      slot.tileId = null;
      els.feedback.textContent = '';
      els.feedback.className = 'feedback';
      renderAnswerAndTiles();
    }

    function answerText() {
      return state.answerSlots.map(slot => slot.fixed ? slot.correct : slot.ch).join('');
    }

    function isComplete() {
      return state.answerSlots.every(slot => slot.fixed || slot.ch);
    }

    function maybeCheckAnswer() {
      if (!isComplete()) return;
      const word = currentPracticeWord();
      if (answerText() === word.en) {
        els.feedback.textContent = `答對了！${word.en} = ${word.zh}`;
        els.feedback.className = 'feedback good';
        speak(word.en);
        starBurst();
        state.autoNextTimer = setTimeout(() => nextPractice(), 950);
      } else {
        els.feedback.textContent = '再試一次～';
        els.feedback.className = 'feedback bad';
        els.answerArea.classList.remove('shake');
        void els.answerArea.offsetWidth;
        els.answerArea.classList.add('shake');
      }
    }

    function clearAnswer() {
      state.answerSlots.forEach(slot => {
        if (!slot.fixed) { slot.ch = ''; slot.tileId = null; }
      });
      state.tiles.forEach(tile => tile.used = false);
      els.feedback.textContent = '';
      els.feedback.className = 'feedback';
      renderAnswerAndTiles();
    }

    function hint() {
      const idx = state.answerSlots.findIndex(slot => !slot.fixed && !slot.ch);
      if (idx === -1) return;
      const need = state.answerSlots[idx].correct;
      const tile = state.tiles.find(t => !t.used && t.ch === need);
      if (!tile) return;
      state.answerSlots[idx].ch = tile.ch;
      state.answerSlots[idx].tileId = tile.id;
      tile.used = true;
      renderAnswerAndTiles();
      maybeCheckAnswer();
    }

    function showAnswer() {
      const word = currentPracticeWord();
      els.feedback.textContent = `答案：${word.en}`;
      els.feedback.className = 'feedback good';
      speak(word.en);
    }

    function reshuffleCurrent() {
      const word = currentPracticeWord();
      const chars = Array.from(word.en);
      const unusedLetters = chars.map((ch, index) => ({ ch, index })).filter(item => !isFixedChar(item.ch));
      state.tiles = shuffle(unusedLetters).map((item, i) => ({ id: `r${Date.now()}_${i}_${item.index}`, ch: item.ch, used: false }));
      state.answerSlots = chars.map(ch => isFixedChar(ch)
        ? { fixed: true, ch, correct: ch, tileId: null }
        : { fixed: false, ch: '', correct: ch, tileId: null }
      );
      els.feedback.textContent = '';
      els.feedback.className = 'feedback';
      renderAnswerAndTiles();
    }

    function nextPractice() {
      clearTimeout(state.autoNextTimer);
      state.practiceIndex++;
      if (state.practiceIndex >= state.practiceOrder.length) {
        state.practiceIndex = 0;
        state.practiceOrder = shuffle(currentWords());
      }
      renderPractice();
    }

    function starBurst() {
      const symbols = ['⭐','🌟','✨','💛','🎉'];
      for (let i = 0; i < 22; i++) {
        const s = document.createElement('span');
        s.className = 'star';
        s.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        s.style.left = Math.random() * 100 + 'vw';
        s.style.animationDelay = (Math.random() * 150) + 'ms';
        els.stars.appendChild(s);
        setTimeout(() => s.remove(), 1100);
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
    }

    els.studyTab.addEventListener('click', () => setMode('study'));
    els.practiceTab.addEventListener('click', () => setMode('practice'));
    els.unitSelect.addEventListener('change', () => { state.unit = els.unitSelect.value; resetForUnit(); });
    els.studyCard.addEventListener('click', () => speak(currentStudyWord().en));
    els.speakBtn.addEventListener('click', () => speak(currentStudyWord().en));
    els.prevBtn.addEventListener('click', () => nextStudy(-1));
    els.nextBtn.addEventListener('click', () => nextStudy(1));
    els.shuffleStudyBtn.addEventListener('click', () => { state.studyOrder = shuffle(currentWords()); state.studyIndex = 0; renderStudy(); });
    els.clearBtn.addEventListener('click', clearAnswer);
    els.hintBtn.addEventListener('click', hint);
    els.showAnswerBtn.addEventListener('click', showAnswer);
    els.newPracticeBtn.addEventListener('click', reshuffleCurrent);
    els.practiceNextBtn.addEventListener('click', nextPractice);

    document.addEventListener('keydown', (e) => {
      if (state.mode === 'study') {
        if (e.key === 'ArrowRight') nextStudy(1);
        if (e.key === 'ArrowLeft') nextStudy(-1);
        if (e.key === ' ') { e.preventDefault(); speak(currentStudyWord().en); }
      }
      if (state.mode === 'practice') {
        if (e.key === 'Enter') maybeCheckAnswer();
        if (e.key === 'Backspace') {
          const filled = [...state.answerSlots].map((slot, idx) => ({slot, idx})).filter(x => !x.slot.fixed && x.slot.ch);
          const last = filled[filled.length - 1];
          if (last) removeFromSlot(last.idx);
        }
      }
    });

    setupUnits();
    resetForUnit();
  </script>
