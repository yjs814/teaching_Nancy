<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>Grammar Space Beginner 1｜Nancy 老師</title>
<style>
:root{--red:#df3341;--gold:#ffd76a;--ink:#493d55;--cream:#fffaf2;--purple:#7959ba;--pink:#ffe4eb;--mint:#dff5eb}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Microsoft JhengHei",system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 10%,#ffe2e7 0 90px,transparent 92px),radial-gradient(circle at 92% 88%,#e8defc 0 110px,transparent 112px),var(--cream)}
.page{width:min(1080px,calc(100% - 24px));margin:auto;padding:14px 0 30px}
.hero{display:grid;grid-template-columns:1fr 190px;gap:22px;align-items:center;padding:20px 26px;border:3px solid #fff;border-radius:28px;background:linear-gradient(135deg,#fff,#fff0e8);box-shadow:0 10px 25px #6c42501c}
.tag{display:inline-block;padding:5px 12px;border-radius:999px;background:var(--gold);font-weight:900;font-size:12px}.hero h1{margin:7px 0;font-size:clamp(28px,5vw,46px);line-height:1.1;color:#b82334}.hero p{margin:0;color:#856b76}
.cover{width:150px;max-height:190px;justify-self:center;object-fit:contain;border-radius:10px;box-shadow:0 7px 18px #55323b30}
.controls,.unit{margin-top:14px;background:#ffffffeb;border:3px solid #fff;border-radius:24px;box-shadow:0 8px 22px #60445214}.controls{padding:15px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;position:sticky;top:6px;z-index:5}
select,input{font:inherit;border:2px solid #dfd1f1;border-radius:12px;padding:7px;background:#fff}.nav{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}.unit-btn,.action{border:0;border-radius:999px;padding:9px 14px;font-weight:800;cursor:pointer}.unit-btn{background:#f1ebfb;color:#664b9c}.unit-btn.active{background:var(--purple);color:#fff}
.unit{display:none;padding:18px}.unit.show{display:block}.unit-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}.unit-head h2{margin:0;color:#b82334}.topic{flex:1;color:#8b7181}.practice{background:#fff1b9;color:#795525;box-shadow:0 3px 0 #e8ce78}.play{background:var(--mint);color:#34745b}

.home{display:block;width:max-content;margin:18px auto 0;padding:10px 18px;border-radius:999px;background:#fff;color:#6b4f8f;text-decoration:none;font-weight:900;box-shadow:0 3px 0 #d9c9f0}
@media(max-width:600px){.hero{grid-template-columns:1fr 100px;padding:16px}.cover{width:95px;max-height:130px}.controls{position:static}.unit{padding:13px}.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body><main class="page">
<section class="hero"><div><span class="tag">NANCY'S GRAMMAR GARDEN</span><h1>Grammar Space<br>Beginner 1</h1><p>Unit 1～20 單字聽讀與重組拼字練習</p></div><img class="cover" src="grammar_space_beginner_1_cover.png" alt="Grammar Space Beginner 1 課本封面"></section>
<section class="controls"><div class="nav" id="nav"></div><label>速度 <input id="rate" type="range" min=".55" max="1.05" step=".05" value=".8"></label><select id="voice" aria-label="英文語音"></select></section>
<div id="units"></div>
<section class="quiz" id="quiz"><h2 id="quizTitle">🧩 重組單字</h2><div class="progress" id="progress"></div><div class="clue" id="clue"></div><button class="action play" id="hear">🔊 聽發音</button><div class="answer" id="answer">點選下方字母開始拼字</div><div class="letters" id="letters"></div><div class="feedback" id="feedback"></div><div class="quiz-actions"><button class="action" id="undo">↩ 撤回</button><button class="action" id="mix">🔀 重新排列</button><button class="action primary" id="check">✓ 檢查答案</button><button class="action" id="next">跳過／下一題 →</button><button class="action" id="close">關閉練習</button></div></section>
<a class="home" href="index.html">🏠 回到單字練習首頁</a>
</main>
<script>
const units=[{"n":1,"sentence":"Harry is my dog.","topic":"名詞 Nouns","words":[["boy","男孩"],["girl","女孩"],["teacher","老師"],["student","學生"],["dog","狗"],["kitten","小貓"],["rabbit","兔子"],["elephant","大象"],["school","學校"],["library","圖書館"],["park","公園"],["house","房子"],["museum","博物館"],["hamster","倉鼠"],["zebra","斑馬"],["giraffe","長頸鹿"],["balloon","氣球"],["bike","腳踏車"],["bottle","瓶子"],["wallet","皮夾"]]},{"n":2,"sentence":"A pink dress and an orange.","topic":"冠詞 Articles","words":[["dress","洋裝"],["artist","藝術家"],["island","島嶼"],["octopus","章魚"],["umbrella","雨傘"],["eraser","橡皮擦"],["ant","螞蟻"],["office","辦公室"],["owl","貓頭鷹"],["sun","太陽"],["moon","月亮"],["sky","天空"],["candle","蠟燭"],["bookshelf","書架"],["scientist","科學家"],["roof","屋頂"],["party","派對"],["mop","拖把"],["truck","卡車"]]},{"n":3,"sentence":"I see three wolves.","topic":"複數名詞 Plural Nouns","words":[["tree","樹木"],["glass","玻璃杯"],["story","故事"],["wolf","野狼"],["bench","長椅"],["cherry","櫻桃"],["balloon","氣球"],["leaf","葉子"],["box","箱子"],["potato","馬鈴薯"],["brush","刷子"],["watch","手錶"],["scarf","圍巾"],["knife","刀子"],["butterfly","蝴蝶"],["sandwich","三明治"],["ladybug","瓢蟲"]]},{"n":4,"sentence":"I want some bread.","topic":"可數與不可數名詞 Count & Noncount Nouns","words":[["song","歌曲"],["dollar","元"],["orange","橘子"],["onion","洋蔥"],["bug","昆蟲"],["egg","蛋"],["cookie","餅乾"],["banana","香蕉"],["pear","西洋梨"],["music","音樂"],["money","錢"],["bread","麵包"],["tea","茶"],["juice","果汁"],["soup","湯"],["butter","奶油"],["water","水"],["cheese","起司"],["honey","蜂蜜"],["toothpaste","牙膏"],["flour","麵粉"],["shampoo","洗髮精"],["yogurt","優格"],["sugar","糖"],["oil","油"],["ham","火腿"]]},{"n":5,"sentence":"We are brave.","topic":"主格代名詞與 Be 動詞 Subject Pronouns & Be","words":[["I","我"],["you","你/你們"],["he","他"],["she","她"],["it","它/牠"],["we","我們"],["they","他們/牠們"],["brave","勇敢的"],["busy","忙碌的"],["heavy","重的"],["sleepy","想睡的"],["tall","高的"],["fat","胖的"],["old","老的"],["classmate","同班同學"],["delicious","美味的"],["musician","音樂家"],["shy","害羞的"],["foolish","愚蠢的"],["magical","有魔力的"],["lost","迷路的"]]},{"n":6,"sentence":"She is not a lawyer.","topic":"Be 動詞否定與問句 Be: Negative & Questions","words":[["Canadian","加拿大的"],["French","法國的"],["American","美國的"],["smart","聰明的"],["stupid","愚蠢的"],["duck","鴨子"],["chicken","小雞/雞肉"],["dragonfly","蜻蜓"],["princess","公主"],["lawyer","律師"],["daughter","女兒"],["hairdresser","美髮師"],["mailman","郵差"],["swimmer","游泳選手"],["diligent","勤勉的"],["hungry","飢餓的"],["tired","疲倦的"],["scary","可怕的"]]},{"n":7,"sentence":"Who is that man?","topic":"Be 動詞特殊疑問句 Be: Wh-questions","words":[["building","建築物"],["chef","廚師"],["post office","郵局"],["gloves","手套"],["skunk","臭鼬"],["phone","電話"],["presents","禮物"],["blueberries","藍莓"],["twins","雙胞胎"],["doves","鴿子"]]},{"n":8,"sentence":"There is a tent.","topic":"There + Be 句型 There + Be","words":[["cucumber","小黃瓜"],["melon","甜瓜"],["star","星星"],["river","河流"],["cow","母牛"],["tent","帳篷"],["bowl","碗"],["farm","農場"],["rose","玫瑰"],["soda","汽水"],["soldiers","士兵"],["queen","女王"]]},{"n":9,"sentence":"These are mittens.","topic":"指示代名詞 Demonstrative Pronouns","words":[["bat","球棒"],["jar","罐子"],["glove","手套"],["stick","棒子"],["vase","花瓶"],["mitten","連指手套"],["peach","桃子"],["computer","電腦"],["dresser","衣櫃"],["bucket","水桶"],["sock","襪子"],["frog","青蛙"],["scissors","剪刀"],["spinach","菠菜"],["microwave","微波爐"],["telescope","望遠鏡"],["spacecraft","太空船"]]},{"n":10,"sentence":"That is her coat.","topic":"所有格形容詞 Possessive Adjectives","words":[["my","我的"],["your","你的"],["his","他的"],["her","她的"],["its","它的/牠的"],["our","我們的"],["their","他們的"],["sneakers","球鞋"],["feather","羽毛"],["brown","棕色的"],["blond","金色的"],["bow tie","領結"],["coat","外套"],["sweater","毛衣"],["wing","翅膀"],["neck","脖子"],["turtle","烏龜"]]},{"n":11,"sentence":"It is a round clock.","topic":"形容詞 Adjectives","words":[["red","紅色的"],["blue","藍色的"],["white","白色的"],["pink","粉紅色的"],["yellow","黃色的"],["green","綠色的"],["black","黑色的"],["big","大的"],["small","小的"],["long","長的"],["short","短的"],["round","圓的"],["square","正方形的"],["rectangular","長方形的"],["thick","厚的"],["huge","巨大的"],["happy","快樂的"],["angry","生氣的"],["thirsty","口渴的"],["sick","生病的"],["sad","悲傷的"],["pretty","漂亮的"],["beautiful","美麗的"],["clean","乾淨的"],["ugly","醜陋的"],["cute","可愛的"],["dirty","髒的"],["young","年輕的"],["expensive","昂貴的"],["sharp","鋒利的"],["strong","強壯的"],["noisy","吵鬧的"]]},{"n":12,"sentence":"A soap is next to the sink.","topic":"地方介系詞 Prepositions of Place","words":[["in","在...裡面"],["on","在...上面"],["under","在...下面"],["behind","在...後面"],["next to","在...旁邊"],["in front of","在...前面"],["bathtub","浴缸"],["toy duck","玩具鴨"],["soap","肥皂"],["sink","洗手台"],["comb","梳子"],["toilet","馬桶"],["towel","毛巾"],["refrigerator","冰箱"],["floor","地板"],["mat","墊子"],["toothbrush","牙刷"],["pillow","枕頭"]]},{"n":13,"sentence":"They jump and laugh.","topic":"現在簡單式-主動一致 Present Simple: Agreement","words":[["eat","吃"],["look","看"],["drink","喝"],["sleep","睡"],["walk","走路"],["read","閱讀"],["run","跑步"],["write","寫字"],["swim","游泳"],["sing","唱歌"],["play","玩/打球"],["dance","跳舞"],["work","工作"],["climb","攀爬"],["kick","踢"],["speak","說話"],["wear","穿著"],["rule","統治"],["lay","產卵"],["smile","微笑"],["jump","跳躍"],["draw","畫畫"],["cut","剪"],["bake","烘烤"],["paint","繪畫"]]},{"n":14,"sentence":"He gets up early.","topic":"現在簡單式-肯定句 Present Simple: Positive","words":[["like","喜歡"],["catch","抓/接"],["brush","刷"],["kiss","親吻"],["mix","混合"],["fly","飛"],["cry","哭泣"],["have/has","有"],["go","去"],["do","做"],["wash","洗"],["study","學習/研讀"],["teach","教導"],["fix","修理"],["ride","騎"],["love","愛"],["hope","希望"],["get up","起床"],["watch","觀看"]]},{"n":15,"sentence":"I don't ski in winter.","topic":"現在簡單式-否定句 Present Simple: Negative","words":[["garlic","大蒜"],["store","商店"],["sell","賣"],["exercise","運動"],["enjoy","享受"],["ski","滑雪"],["flute","長笛"],["common","共同點"],["horror movie","恐怖片"]]},{"n":16,"sentence":"Do you take a walk?","topic":"現在簡單式-一般疑問句 Present Simple: Yes/No","words":[["carrots","紅蘿蔔"],["boots","靴子"],["bark","吠叫"],["early","早的/早地"],["uniform","制服"],["take a walk","散步"],["habit","習慣"],["questionnaire","問卷"],["evening","傍晚/晚上"]]},{"n":17,"sentence":"What do you collect?","topic":"現在簡單式-特殊疑問句 Present Simple: Wh-questions","words":[["chicken","雞肉"],["chocolate cake","巧克力蛋糕"],["garlic","大蒜"],["spaghetti","義大利麵"],["hate","討厭"],["practice","練習"],["collect","收集"],["stamp","郵票"],["text message","簡訊"],["hairpin","髮夾"],["jigsaw puzzle","拼圖"],["badminton","羽毛球"]]},{"n":18,"sentence":"I can skate well.","topic":"助動詞 Can 表达能力 Can: Ability","words":[["piano","鋼琴"],["violin","小提琴"],["skate","溜冰"],["talk","說話"],["chess","西洋棋"],["guitar","吉他"],["team","團隊"],["shoot","投籃/射門"],["pass","傳球"],["dribble","運球"]]},{"n":19,"sentence":"May I use your phone?","topic":"助動詞 Can/May 表达許可 Can/May: Permission","words":[["sit","坐"],["leave","離開"],["use","使用"],["touch","碰觸"],["come in","進來"],["borrow","借"],["break","休息"],["open","打開"],["smartphone","智慧型手機"],["elevator","電梯"],["library","圖書館"],["rules","規則"],["copy","影印"]]},{"n":20,"sentence":"Please raise your hand.","topic":"祈使句 Imperatives","words":[["clean","打掃"],["close","關閉"],["wait","等待"],["move","移動"],["late","遲到"],["follow","遵守/跟隨"],["respect","尊重"],["protect","保護"],["campsite","露營地"],["popcorn","爆米花"],["raise hand","舉手"],["climb mountain","爬山"]]}];
let voices=[],selectedVoice=null,currentUnit=units[0],order=[],qIndex=0,pool=[],chosen=[];
const nav=document.getElementById("nav"),unitsEl=document.getElementById("units");
function loadVoices(){voices=speechSynthesis.getVoices().filter(v=>v.lang.startsWith("en"));const s=document.getElementById("voice");s.innerHTML="";voices.forEach((v,i)=>{const o=document.createElement("option");o.value=i;o.textContent=v.name+" ("+v.lang+")";s.appendChild(o)});let i=voices.findIndex(v=>v.lang==="en-US");if(i<0)i=0;s.value=i;selectedVoice=voices[i]}
speechSynthesis.onvoiceschanged=loadVoices;loadVoices();document.getElementById("voice").onchange=e=>selectedVoice=voices[e.target.value];
function speak(text){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=+document.getElementById("rate").value;u.pitch=1.08;if(selectedVoice)u.voice=selectedVoice;speechSynthesis.speak(u)}
function showUnit(n){document.querySelectorAll(".unit").forEach(x=>x.classList.remove("show"));document.getElementById("unit-"+n).classList.add("show");document.querySelectorAll(".unit-btn").forEach(x=>x.classList.toggle("active",+x.dataset.n===n));currentUnit=units.find(x=>x.n===n)}
units.forEach((u,i)=>{const b=document.createElement("button");b.className="unit-btn"+(i?"":" active");b.dataset.n=u.n;b.textContent="U"+u.n;b.onclick=()=>showUnit(u.n);nav.appendChild(b);const s=document.createElement("section");s.className="unit"+(i?"":" show");s.id="unit-"+u.n;s.innerHTML='<div class="unit-head"><h2>Unit '+u.n+'</h2><span class="topic">'+u.sentence+'・'+u.topic+'</span><button class="action play">▶ 全部播放</button><button class="action practice">🧩 重組練習</button></div><div class="grid"></div>';const g=s.querySelector(".grid");u.words.forEach(([e,c])=>{const w=document.createElement("button");w.className="word";w.innerHTML='<span class="eng">🔊 '+e+'</span><span class="chi">'+c+'</span>';w.onclick=()=>speak(e);g.appendChild(w)});s.querySelector(".play").onclick=()=>playAll(u);s.querySelector(".practice").onclick=()=>startQuiz(u);unitsEl.appendChild(s)});
function playAll(u){let i=0;speechSynthesis.cancel();function next(){if(i>=u.words.length)return;const x=new SpeechSynthesisUtterance(u.words[i++][0]);x.lang="en-US";x.rate=+document.getElementById("rate").value;x.pitch=1.08;if(selectedVoice)x.voice=selectedVoice;x.onend=()=>setTimeout(next,180);speechSynthesis.speak(x)}next()}
function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(u){currentUnit=u;order=shuffle(u.words.map((_,i)=>i));qIndex=0;document.getElementById("quiz").classList.add("show");render();document.getElementById("quiz").scrollIntoView({behavior:"smooth"})}
function word(){return currentUnit.words[order[qIndex]]}
function render(){const [e,c]=word();chosen=[];pool=shuffle(e.toLowerCase().replace(/[^a-z]/g,"").split("").map((letter,id)=>({letter,id})));document.getElementById("quizTitle").textContent="🧩 Unit "+currentUnit.n+" 重組單字";document.getElementById("progress").textContent="第 "+(qIndex+1)+" 題／共 "+order.length+" 題";document.getElementById("clue").textContent=c;document.getElementById("feedback").textContent="";draw()}
function draw(){const a=document.getElementById("answer");a.innerHTML=chosen.length?chosen.map(x=>'<span class="slot">'+x.letter+'</span>').join(""):"點選下方字母開始拼字";const l=document.getElementById("letters");l.innerHTML="";pool.forEach(x=>{const b=document.createElement("button");b.className="letter";b.textContent=x.letter;b.disabled=chosen.some(y=>y.id===x.id);b.onclick=()=>{chosen.push(x);draw()};l.appendChild(b)})}
function next(){qIndex=(qIndex+1)%order.length;render()}
document.getElementById("hear").onclick=()=>speak(word()[0]);document.getElementById("undo").onclick=()=>{chosen.pop();draw()};document.getElementById("mix").onclick=()=>{chosen=[];pool=shuffle(pool);draw()};document.getElementById("next").onclick=next;document.getElementById("close").onclick=()=>document.getElementById("quiz").classList.remove("show");document.getElementById("check").onclick=()=>{const ok=chosen.map(x=>x.letter).join("")===word()[0].toLowerCase().replace(/[^a-z]/g,"");const f=document.getElementById("feedback");f.textContent=ok?"🎉 答對了！":"再試一次，你可以的！";f.style.color=ok?"#32956b":"#d45370";if(ok){speak(word()[0]);setTimeout(next,900)}};
</script></body></html>
